<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>G10 生物选择题随机练习</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17312b;
      --muted: #64746f;
      --paper: #fffdf7;
      --line: #dce7e2;
      --green: #19735a;
      --green-soft: #e9f5ef;
      --red: #b64040;
      --red-soft: #fff0ef;
      --gold: #d9a441;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 5%, #eef8f0 0, transparent 28rem),
        linear-gradient(135deg, #f8f4e8, #edf5ef);
    }
    button, input { font: inherit; }
    .app { width: min(920px, calc(100% - 28px)); margin: 0 auto; padding: 28px 0 60px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: clamp(24px, 5vw, 38px); letter-spacing: .03em; }
    .subtitle { margin: 6px 0 0; color: var(--muted); }
    .shuffle {
      border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px;
      background: rgba(255,255,255,.8); color: var(--ink); cursor: pointer;
    }
    .progress-wrap {
      display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
      margin: 18px 0;
    }
    .progress { height: 10px; background: #dfe8e3; border-radius: 20px; overflow: hidden; }
    .progress > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--green), #50aa7d); transition: width .25s; }
    .progress-text { color: var(--muted); min-width: 78px; text-align: right; }
    .card {
      background: rgba(255,253,247,.96); border: 1px solid rgba(38,91,72,.13);
      border-radius: 24px; padding: clamp(22px, 5vw, 42px);
      box-shadow: 0 22px 60px rgba(42,72,59,.12);
    }
    .tag { color: var(--green); font-weight: 700; margin-bottom: 14px; }
    .question { font-size: clamp(19px, 3.2vw, 25px); line-height: 1.75; margin: 0 0 22px; }
    .figure {
      display: block; max-width: 100%; max-height: 430px; object-fit: contain;
      margin: 0 auto 24px; border-radius: 12px; border: 1px solid var(--line);
      background: white;
    }
    .options { display: grid; gap: 12px; }
    .options.layout-four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .options.layout-two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .options.layout-one { grid-template-columns: minmax(0, 1fr); }
    .option {
      display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: center;
      width: 100%; border: 1px solid var(--line); border-radius: 15px;
      padding: 14px 16px; text-align: left; background: white; color: var(--ink);
      cursor: pointer; transition: transform .12s, border-color .12s, background .12s;
    }
    .option:hover { transform: translateY(-1px); border-color: #81b8a2; }
    .option.selected { border-color: var(--green); background: var(--green-soft); box-shadow: 0 0 0 2px rgba(25,115,90,.08); }
    .letter {
      display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
      background: #eef2ef; font-weight: 800;
    }
    .option.selected .letter { background: var(--green); color: white; }
    .actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 26px; }
    .primary {
      border: 0; border-radius: 14px; padding: 13px 24px; color: white;
      background: var(--green); font-weight: 700; cursor: pointer;
    }
    .primary:disabled { opacity: .42; cursor: not-allowed; }
    .secondary {
      border: 1px solid var(--line); border-radius: 14px; padding: 13px 24px;
      color: var(--ink); background: white; font-weight: 700; cursor: pointer;
    }
    .secondary:disabled { opacity: .42; cursor: not-allowed; }
    .results h2 { font-size: 30px; margin-top: 0; }
    .score {
      display: inline-flex; align-items: baseline; gap: 6px; padding: 14px 20px;
      border-radius: 16px; background: var(--green-soft); margin-bottom: 24px;
    }
    .score strong { font-size: 34px; color: var(--green); }
    .wrong-list { display: grid; gap: 18px; }
    .wrong {
      border: 1px solid #efcdca; background: var(--red-soft); border-radius: 18px; padding: 20px;
    }
    .wrong h3 { margin: 0 0 10px; line-height: 1.6; }
    .wrong p { margin: 7px 0; line-height: 1.6; }
    .user-answer { color: var(--red); }
    .correct-answer { color: var(--green); font-weight: 700; }
    .all-correct { padding: 22px; border-radius: 18px; background: var(--green-soft); font-size: 20px; }
    .hidden { display: none !important; }
    @media (max-width: 620px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .shuffle { align-self: stretch; }
      .card { border-radius: 18px; }
      .options.layout-four { gap: 8px; }
      .options.layout-four .option {
        grid-template-columns: 1fr; gap: 7px; justify-items: center;
        padding: 10px 6px; text-align: center;
      }
      .options.layout-four .letter { width: 30px; height: 30px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>生物选择题随机练习</h1>
        <p class="subtitle">共 136 题，完成后统一显示成绩和全部错题。</p>
      </div>
      <button class="shuffle" id="restart" type="button">重新随机开始</button>
    </header>

    <section id="quiz">
      <div class="progress-wrap">
        <div class="progress"><div id="progressBar"></div></div>
        <div class="progress-text" id="progressText"></div>
      </div>
      <article class="card">
        <div class="tag" id="questionTag"></div>
        <p class="question" id="questionText"></p>
        <img class="figure hidden" id="questionImage" alt="题目插图">
        <div class="options" id="options"></div>
        <div class="actions">
          <button class="secondary" id="previous" type="button">上一题</button>
          <button class="primary" id="next" type="button" disabled>下一题</button>
        </div>
      </article>
    </section>

    <section class="card results hidden" id="results">
      <h2>练习完成</h2>
      <div class="score"><strong id="score"></strong><span id="scoreDetail"></span></div>
      <div id="wrongSummary"></div>
      <div class="wrong-list" id="wrongList"></div>
      <div class="actions">
        <button class="primary" id="again" type="button">再随机练习一次</button>
      </div>
    </section>
  </main>

  <script>
    const SOURCE_QUESTIONS = [{"id":1,"question":"2018年《Cell》期刊报道，中国科学院上海神经科学研究所利用体细胞核移植技术，克隆出两只长尾猕猴，取名为“中中”和“华华”，这一里程碑式的成果让世界瞩目。决定“中中\"与“华华\"的性状极为相似的物质存在于","answer":"D","options":{"A":"细胞壁","B":"细胞膜","C":"细胞质","D":"细胞核"}},{"id":2,"question":"T2噬菌体侵染大肠杆菌的实验证明了","answer":"A","options":{"A":"DNA是遗传物质","B":"RNA是遗传物质","C":"蛋白质是遗传物质","D":"糖类是遗传物质"}},{"id":3,"question":"下列有关生物进化的表述，不正确的是","answer":"C","options":{"A":"捕食者的存在可促进被捕食者的进化","B":"生物之间的相互关系影响生物的进化","C":"突变和基因重组决定生物进化的方向","D":"生物多样性的形成是生物进化的结果"}},{"id":4,"question":"马达加斯加与非洲大陆只相隔狭窄的海峡，但是两地生物种类有较大差异。造成这种现象最可能的原因是","answer":"A","options":{"A":"自然选择的方向不同","B":"它们的祖先不同","C":"岛上的生物没有进化","D":"变异的方向不同"}},{"id":5,"question":"《晋书.车胤传》有“映雪囊萤”的典故，记载了东晋时期名臣车胤日夜苦读，将萤火虫聚集起来照明读书的故事。萤火虫尾部可发光，为发光直接供能的物质是","answer":"C","options":{"A":"淀粉","B":"脂肪","C":"ATP","D":"蛋白质"}},{"id":6,"question":"细菌被归为原核生物的原因是","answer":"C","options":{"A":"细胞体积小","B":"单细胞","C":"没有成形的细胞核","D":"没有DNA"}},{"id":7,"question":"下列有关生物体内蛋白质多样性的原因中不正确的是","answer":"A","options":{"A":"组成肽键的化学元素不同","B":"组成蛋白质的氨基酸种类和数量不同","C":"蛋白质的空间结构不同","D":"组成蛋白质的氨基酸排列顺序不同"}},{"id":8,"question":"细胞学说揭示了","answer":"B","options":{"A":"植物细胞与动物细胞的区别","B":"生物体结构的统一性","C":"细胞为什么能产生新细胞","D":"人类认识细胞是一个曲折的过程"}},{"id":9,"question":"原核细胞和真核细胞最明显的区别是","answer":"D","options":{"A":"有无核物质","B":"有无核糖体","C":"有无细胞膜","D":"有无核膜"}},{"id":10,"question":"下列元素中，构成有机物基本骨架的是","answer":"D","options":{"A":"氮","B":"氢","C":"氧","D":"碳"}},{"id":11,"question":"在封闭的温室内栽种农作物，下列不能提高作物产量的措施是","answer":"A","options":{"A":"降低室内CO₂浓度","B":"保持合理的室内昼夜温差","C":"增加光照强度","D":"适当延长光照时间"}},{"id":12,"question":"四分体是细胞在减数分裂过程中","answer":"D","options":{"A":"大小形态相同的四条染色体","B":"互相配对的四条染色体","C":"两条染色体的四个染色单体","D":"一对同源染色体配对时的四个染色单体"}},{"id":13,"question":"一对色觉正常的夫妇生了一个红绿色盲的男孩，男孩的外祖父。外祖母和祖母色觉都正常，祖父为色盲。该男孩的色盲基因来自？","answer":"D","options":{"A":"祖父","B":"祖母","C":"外祖父","D":"外祖母"}},{"id":14,"question":"、太空种菜实验过程中发现，生菜在红光照射下生长得好，在蓝光照射下形态舒展。下列色素中与植物叶肉细胞的光反应无关的是","answer":"D","options":{"A":"叶绿素a","B":"叶绿素b","C":"类胡萝卜素","D":"花青素"}},{"id":15,"question":"与细胞膜形成的吞噬泡融合，并消化吞噬泡内物质的细胞器是","answer":"D","options":{"A":"线粒体","B":"内质网","C":"高尔基体","D":"溶酶体"}},{"id":16,"question":"烫发时，先用还原剂使头发角蛋白的二硫键断裂，再用卷发器将头发固定形状，最后用氧化剂使角蛋白在新的位置形成二硫键。这一过程改变了角蛋白的","answer":"A","options":{"A":"空间结构","B":"氨基酸种类","C":"氨基酸数目","D":"氨基酸排列顺序"}},{"id":17,"question":"下列与人们饮食观念相关的叙述中，正确的是","answer":"C","options":{"A":"脂质会使人发胖，不要摄入","B":"谷物不含糖类，糖尿病患者可放心食用","C":"食物含有基因，这些DNA片段可被消化分解","D":"肉类中的蛋白质经油炸、烧烤后，更益于健康"}},{"id":18,"question":"决定自然界中生物特异性和多样性的根本原因是","answer":"A","options":{"A":"DNA分子的多样性和特异性","B":"蛋白质分子的多样性和特异性","C":"化学元素的多样性和特异性","D":"氨基酸分子的多样性和特异性"}},{"id":19,"question":"纸层析法可用来分离光合色素，下列装置正确的是","answer":"C","options":{"A":"装置①","B":"装置②","C":"装置③","D":"装置④"},"image":"quiz_assets/q19.png"},{"id":20,"question":"萤火虫尾部可以发光，发光的直接供能物质是","answer":"D","options":{"A":"淀粉","B":"蛋白质","C":"脂肪","D":"ATP"}},{"id":21,"question":"在大田的边缘和水沟的两侧，同一品种的小麦植株总体上比大田中间的植株长得高壮，产生这种现象的主要原因是","answer":"B","options":{"A":"基因重组引起的性状分离","B":"环境差异引起的性状分离","C":"隐性基因突变为显性基因","D":"染色体的结构和数目的变化"}},{"id":22,"question":"关于分子的双螺旋结构的叙述正确的是","answer":"B","options":{"A":"核苷酸通过肽键相互连接","B":"A与T配对，C与G配对","C":"DNA分子的两条链方向相同","D":"碱基和磷酸交替排列在内侧"}},{"id":23,"question":"DNA在完全水解后，得到的化学物质是","answer":"D","options":{"A":"氨基酸、葡萄糖、碱基","B":"氨基酸、核苷酸、葡萄糖","C":"核糖、碱基、磷酸","D":"脱氧核糖、碱基、磷酸"}},{"id":24,"question":"线粒体、叶绿体和内质网都具有","answer":"C","options":{"A":"基粒","B":"能量转换的功能","C":"膜结构","D":"少量DNA"}},{"id":25,"question":"下列细胞结构中，由双层膜包被的是","answer":"D","options":{"A":"液泡","B":"高尔基体","C":"内质网","D":"细胞核"}},{"id":26,"question":"嫩肉粉可以使肉类食品口感松软变嫩，其主要成分应该是","answer":"B","options":{"A":"核酸酶","B":"蛋白酶","C":"脂肪酶","D":"淀粉酶"}},{"id":27,"question":"活细胞中含量最多的化合物是","answer":"B","options":{"A":"蛋白质","B":"水","C":"糖","D":"DNA"}},{"id":28,"question":"唾液腺细胞中合成淀粉酶的细胞器是","answer":"B","options":{"A":"线粒体","B":"核糖体","C":"内质网","D":"高尔基体"}},{"id":29,"question":"可以与细胞膜形成的吞噬泡融合，并消化掉吞噬泡内物质的细胞器是","answer":"D","options":{"A":"线粒体","B":"内质网","C":"高尔基体","D":"溶酶体"}},{"id":30,"question":"下列有关细胞膜结构和功能的叙述中，不正确的是","answer":"A","options":{"A":"细胞膜具有全透性","B":"细胞膜具有识别功能","C":"细胞膜有一定的流动性","D":"细胞膜的两侧结构不对称"}},{"id":31,"question":"细胞核中携带遗传信息的是","answer":"D","options":{"A":"核膜","B":"核孔","C":"核仁","D":"染色质"}},{"id":32,"question":"下列遗传病中，由染色体变异引起的是","answer":"C","options":{"A":"白化病","B":"血友病","C":"猫叫综合征","D":"镰刀型细胞贫血症"}},{"id":33,"question":"遗传咨询对预防遗传病有积极意义。下列情形中不需要遗传咨询的是","answer":"A","options":{"A":"男方幼年曾因外伤截肢","B":"亲属中有智力障碍患者","C":"女方是先天性聋哑患者","D":"亲属中有血友病患者"}},{"id":34,"question":"我国科学家精选的农作物种子通过“天宫一号”搭载上天，利用宇宙空间特殊环境诱发的变异育种，这些变异","answer":"C","options":{"A":"是定向的","B":"对人类都有益","C":"为人工选择提供原材料","D":"不能遗传给后代"}},{"id":35,"question":"蜜蜂采蜜时，口器伸入鼠尾草的花筒中，头部推动鼠尾草“T”字形雄蕊，花粉落在头部。鼠尾草雄蕊先成熟，等到雄蕊凋谢后雌蕊成熟，其他蜜蜂采蜜时可使花粉落到柱头。下列相关叙述不正确的是","answer":"B","options":{"A":"鼠尾草的“T”字形雄蕊结构有利于虫媒传粉","B":"蜜蜂采蜜时与鼠尾草的花之间不存在信息传递","C":"花蕊成熟时间不同有利于遗传（基因）多样性","D":"鼠尾草与蜜蜂相互适应、协同进化"},"image":"quiz_assets/q35.png"},{"id":36,"question":"近期流行的乙流病毒是一种单链RNA膜病毒。当其遗传物质RNA完全水解后，得到的化学物质是","answer":"D","options":{"A":"氨基酸、葡萄糖、含氮碱基","B":"核糖、核苷酸、葡萄糖","C":"氨基酸、核苷酸、葡萄糖","D":"核糖、含氮碱基、磷酸"}},{"id":37,"question":"下列有关细胞体积的叙述中，不正确的是","answer":"C","options":{"A":"与原核细胞相比，真核细胞体积一般较大","B":"细胞体积越小，其表面积与体积比值越大","C":"生物体体积越大，其细胞体积也越大","D":"细胞体积小，利于完成各项生命活动"}},{"id":38,"question":"右图是三个相邻植物细胞之间水分流动方向示意图。图中三个细胞的细胞液浓度关系是","answer":"B","options":{"A":"甲>乙>丙","B":"甲\u003c乙\u003c丙","C":"甲>乙，乙\u003c丙","D":"甲\u003c乙，乙>丙"},"image":"quiz_assets/q38.png"},{"id":39,"question":"蔗糖不能透过红细胞的细胞膜。将红细胞分别浸入高浓度的蔗糖溶液和蒸馏水中，一段时间后细胞形态发生的变化是","answer":"D","options":{"A":"涨破、皱缩","B":"皱缩、皱缩","C":"膨胀、膨胀","D":"皱缩、涨破"}},{"id":40,"question":"下图为ATP和ADP相互转化的示意图，对这一过程的叙述不正确的是","answer":"D","options":{"A":"存在着能量的释放和储存","B":"保证了生命活动顺利进行","C":"持续不断地在生物活细胞中进行","D":"合成ATP的能量都来自细胞呼吸"},"image":"quiz_assets/q40.png"},{"id":41,"question":"肺炎双球菌的转化实验中，使R型细菌转化为S型细菌的转化因子是","answer":"D","options":{"A":"荚膜","B":"蛋白质","C":"R型细菌的DNA","D":"S型细菌的DNA"}},{"id":42,"question":"一个DNA分子复制完毕后，新形成的DNA子链","answer":"B","options":{"A":"是DNA母链的片段","B":"与DNA母链之一相同","C":"与DNA母链相同，但U取代T","D":"与DNA母链完全不同"}},{"id":43,"question":"根据遗传学原理， question":"离子束是一种辐射源。用离子束照射番茄种子，选育得到的“鲁番茄7号”有早熟、果实大等特点。这种育种方式属于","answer":"A","options":{"A":"诱变育种","B":"多倍体育种","C":"杂交育种","D":"单倍体育种"}},{"id":131,"question":"海参离开海水时会发生自溶，即构成体壁和肠的蛋白质、糖类均发生不同程度的降解，且降解程度受到温度、pH、盐度的影响。据此推测，促使海参“自溶”的物质最可能是","answer":"D","options":{"A":"水","B":"NaCl","C":"糖类","D":"蛋白质"}},{"id":132,"question":"在“观察根尖分生区组织细胞的有丝分裂”实验中，图中箭头所指细胞的主要特征是","answer":"A","options":{"A":"染色体移向细胞两极","B":"核膜与核仁出现","C":"着丝粒排列在赤道板上","D":"细胞缢裂成两部分"},"image":"quiz_assets/q132.png"},{"id":133,"question":"科学家将拟南芥和水稻种子送至天宫二号，利用宇宙空间的特殊环境诱发的变异进行育种，这些变异","answer":"C","options":{"A":"是定向的","B":"对人类都有益","C":"为人工选择提供原材料","D":"不能遗传给后代"}},{"id":134,"question":"2017年，我国科学家对深圳拟兰进行基因组测序，并与其他兰花基因组比较，结果可为研究兰花的进化提供CA胚胎学证据","answer":"C","options":{"A":"胚胎学证据","B":"古生物化石证据","C":"分子水平证据","D":"比较解剖学证据"}},{"id":135,"question":"鸭蹼病患者手指粘连，某家系中该病只能由父亲遗传给儿子，该家系此致病基因位于","answer":"C","options":{"A":"常染色体","B":"x染色体","C":"Y染色体","D":"线粒体"}},{"id":136,"question":"由于盗猎，某地区40年间雌性非洲象天生无象牙的比例由1&5％上升至33％。相关叙述不正确的是","answer":"B","options":{"A":"该地区的全部非洲象构成一个种群","B":"雌象无象牙比例上升是基因突变的结果","C":"盗猎行为对雌象有无象牙起到选择作用","D":"该过程中种群的基因频率发生定向改变"}}];
    const letters = ['A', 'B', 'C', 'D'];
    // 根据原 DOCX 中每道题的选项段落数，还原四列、两列或单列排版。
    const FOUR_COLUMN_IDS = new Set([
      1, 5, 6, 9, 10, 13, 14, 15, 16, 19, 20, 25, 26, 27, 28, 29,
      31, 32, 39, 43, 47, 49, 56, 57, 59, 61, 62, 63, 66, 68, 71, 72,
      74, 76, 78, 81, 82, 87, 88, 90, 91, 93, 94, 96, 98, 99, 100,
      102, 103, 104, 105, 106, 107, 108, 109, 113, 115, 116, 125,
      126, 127, 131, 135
    ]);
    const TWO_COLUMN_IDS = new Set([
      2, 4, 7, 8, 33, 34, 36, 38, 40, 41, 42, 44, 46, 48, 50, 51,
      53, 55, 65, 70, 77, 79, 80, 83, 84, 85, 86, 92, 95, 97, 101,
      110, 111, 112, 114, 117, 120, 121, 122, 123, 124, 128, 130,
      133, 134, 136
    ]);
    let questions = [];
    let answers = {};
    let index = 0;

    const quiz = document.querySelector('#quiz');
    const results = document.querySelector('#results');
    const progressBar = document.querySelector('#progressBar');
    const progressText = document.querySelector('#progressText');
    const questionTag = document.querySelector('#questionTag');
    const questionText = document.querySelector('#questionText');
    const questionImage = document.querySelector('#questionImage');
    const options = document.querySelector('#options');
    const previous = document.querySelector('#previous');
    const next = document.querySelector('#next');

    function shuffled(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function start() {
      questions = shuffled(SOURCE_QUESTIONS);
      answers = {};
      index = 0;
      results.classList.add('hidden');
      quiz.classList.remove('hidden');
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function render() {
      const item = questions[index];
      progressText.textContent = (index + 1) + ' / ' + questions.length;
      progressBar.style.width = ((index + 1) / questions.length * 100) + '%';
      questionTag.textContent = '随机第 ' + (index + 1) + ' 题 · 原题号 ' + item.id;
      questionText.textContent = item.question;
      options.innerHTML = '';
      options.className = 'options ' + (
        FOUR_COLUMN_IDS.has(item.id)
          ? 'layout-four'
          : TWO_COLUMN_IDS.has(item.id)
            ? 'layout-two'
            : 'layout-one'
      );

      if (item.image) {
        questionImage.src = item.image;
        questionImage.classList.remove('hidden');
      } else {
        questionImage.removeAttribute('src');
        questionImage.classList.add('hidden');
      }

      letters.forEach((letter) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'option';
        if (answers[item.id] === letter) button.classList.add('selected');
        button.innerHTML = '<span class="letter">' + letter + '</span><span></span>';
        button.lastElementChild.textContent = item.options[letter];
        button.addEventListener('click', () => {
          answers[item.id] = letter;
          options.querySelectorAll('.option').forEach((node) => node.classList.remove('selected'));
          button.classList.add('selected');
          next.disabled = false;
        });
        options.appendChild(button);
      });

      next.disabled = !answers[item.id];
      previous.disabled = index === 0;
      next.textContent = index === questions.length - 1 ? '提交并查看错题' : '下一题';
    }

    function goToPreviousQuestion() {
      if (index === 0) return;
      index -= 1;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    previous.addEventListener('click', goToPreviousQuestion);

    next.addEventListener('click', () => {
      if (!answers[questions[index].id]) return;
      if (index < questions.length - 1) {
        index += 1;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        finish();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (quiz.classList.contains('hidden') || event.ctrlKey || event.altKey || event.metaKey) return;

      const key = event.key.toUpperCase();
      if (letters.includes(key)) {
        event.preventDefault();
        const optionIndex = letters.indexOf(key);
        options.querySelectorAll('.option')[optionIndex]?.click();
        return;
      }

      if (event.key === 'Enter' || event.key === ' ' || event.key === 'ArrowRight') {
        event.preventDefault();
        next.click();
      } else if (event.key === 'ArrowLeft') {
        event.preventDefault();
        previous.click();
      }
    });

    function finish() {
      const wrong = questions.filter((item) => answers[item.id] !== item.answer);
      const correct = questions.length - wrong.length;
      document.querySelector('#score').textContent = correct;
      document.querySelector('#scoreDetail').textContent = '/ ' + questions.length + ' 题正确';

      const summary = document.querySelector('#wrongSummary');
      const list = document.querySelector('#wrongList');
      list.innerHTML = '';
      if (!wrong.length) {
        summary.innerHTML = '<div class="all-correct">全部答对，完成得很漂亮。</div>';
      } else {
        summary.innerHTML = '<p>共答错 <strong>' + wrong.length + '</strong> 题，下面列出全部错题。</p>';
        wrong.forEach((item) => {
          const block = document.createElement('article');
          block.className = 'wrong';
          const image = item.image ? '<img class="figure" src="' + item.image + '" alt="题目插图">' : '';
          block.innerHTML =
            '<h3>原题号 ' + item.id + '：' + escapeHtml(item.question) + '</h3>' +
            image +
            '<p class="user-answer">你的答案：' + answers[item.id] + '．' + escapeHtml(item.options[answers[item.id]]) + '</p>' +
            '<p class="correct-answer">正确答案：' + item.answer + '．' + escapeHtml(item.options[item.answer]) + '</p>';
          list.appendChild(block);
        });
      }

      quiz.classList.add('hidden');
      results.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    document.querySelector('#restart').addEventListener('click', start);
    document.querySelector('#again').addEventListener('click', start);
    start();
  </script>
</body>
</html>
