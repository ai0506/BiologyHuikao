<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>G10 生物选择题随机练习</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17312b;
      --muted: #64746f;
      --paper: #fffdf7;
      --line: #dce7e2;
      --green: #19735a;
      --green-soft: #e9f5ef;
      --red: #b64040;
      --red-soft: #fff0ef;
      --gold: #d9a441;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 5%, #eef8f0 0, transparent 28rem),
        linear-gradient(135deg, #f8f4e8, #edf5ef);
    }
    button, input { font: inherit; }
    .app { width: min(920px, calc(100% - 28px)); margin: 0 auto; padding: 28px 0 60px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: clamp(24px, 5vw, 38px); letter-spacing: .03em; }
    .subtitle { margin: 6px 0 0; color: var(--muted); }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .auto-next {
      display: inline-flex; align-items: center; gap: 8px; padding: 9px 13px;
      border: 1px solid var(--line); border-radius: 999px;
      background: rgba(255,255,255,.8); color: var(--ink); cursor: pointer;
      white-space: nowrap;
    }
    .auto-next input { width: 18px; height: 18px; accent-color: var(--green); cursor: pointer; }
    .shuffle {
      border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px;
      background: rgba(255,255,255,.8); color: var(--ink); cursor: pointer;
    }
    .shuffle:disabled { opacity: .55; cursor: wait; }
    .progress-wrap {
      display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
      margin: 18px 0;
    }
    .progress { height: 10px; background: #dfe8e3; border-radius: 20px; overflow: hidden; }
    .progress > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--green), #50aa7d); transition: width .25s; }
    .progress-text { color: var(--muted); min-width: 78px; text-align: right; }
    .card {
      background: rgba(255,253,247,.96); border: 1px solid rgba(38,91,72,.13);
      border-radius: 24px; padding: clamp(22px, 5vw, 42px);
      box-shadow: 0 22px 60px rgba(42,72,59,.12);
    }
    .tag { color: var(--green); font-weight: 700; margin-bottom: 14px; }
    .question { font-size: clamp(19px, 3.2vw, 25px); line-height: 1.75; margin: 0 0 22px; }
    .figure {
      display: block; max-width: 100%; max-height: 430px; object-fit: contain;
      margin: 0 auto 24px; border-radius: 12px; border: 1px solid var(--line);
      background: white;
    }
    .options { display: grid; gap: 12px; }
    .options.layout-four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .options.layout-two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .options.layout-one { grid-template-columns: minmax(0, 1fr); }
    .option {
      display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: center;
      width: 100%; border: 1px solid var(--line); border-radius: 15px;
      padding: 14px 16px; text-align: left; background: white; color: var(--ink);
      cursor: pointer; transition: transform .12s, border-color .12s, background .12s;
    }
    .option:hover { transform: translateY(-1px); border-color: #81b8a2; }
    .option.selected { border-color: var(--green); background: var(--green-soft); box-shadow: 0 0 0 2px rgba(25,115,90,.08); }
    .letter {
      display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
      background: #eef2ef; font-weight: 800;
    }
    .option.selected .letter { background: var(--green); color: white; }
    .actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 26px; }
    .primary {
      border: 0; border-radius: 14px; padding: 13px 24px; color: white;
      background: var(--green); font-weight: 700; cursor: pointer;
    }
    .primary:disabled { opacity: .42; cursor: not-allowed; }
    .secondary {
      border: 1px solid var(--line); border-radius: 14px; padding: 13px 24px;
      color: var(--ink); background: white; font-weight: 700; cursor: pointer;
    }
    .secondary:disabled { opacity: .42; cursor: not-allowed; }
    .results h2 { font-size: 30px; margin-top: 0; }
    .score {
      display: inline-flex; align-items: baseline; gap: 6px; padding: 14px 20px;
      border-radius: 16px; background: var(--green-soft); margin-bottom: 24px;
    }
    .score strong { font-size: 34px; color: var(--green); }
    .wrong-list { display: grid; gap: 18px; }
    .wrong {
      border: 1px solid #efcdca; background: var(--red-soft); border-radius: 18px; padding: 20px;
    }
    .wrong h3 { margin: 0 0 10px; line-height: 1.6; }
    .wrong p { margin: 7px 0; line-height: 1.6; }
    .user-answer { color: var(--red); }
    .correct-answer { color: var(--green); font-weight: 700; }
    .all-correct { padding: 22px; border-radius: 18px; background: var(--green-soft); font-size: 20px; }
    .hidden { display: none !important; }
    @media (max-width: 620px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .top-actions { width: 100%; flex-wrap: wrap; }
      .auto-next, .shuffle { flex: 1 1 auto; justify-content: center; }
      .card { border-radius: 18px; }
      .options.layout-four { gap: 8px; }
      .options.layout-four .option {
        grid-template-columns: 1fr; gap: 7px; justify-items: center;
        padding: 10px 6px; text-align: center;
      }
      .options.layout-four .letter { width: 30px; height: 30px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>生物选择题随机练习</h1>
        <p class="subtitle" id="subtitle">正在加载题库...</p>
      </div>
      <div class="top-actions">
        <label class="auto-next" title="选择答案后自动进入下一题">
          <input id="autoNext" type="checkbox">
          <span>自动下一题</span>
        </label>
        <button class="shuffle" id="restart" type="button" disabled>重新随机开始</button>
      </div>
    </header>

    <section id="quiz">
      <div class="progress-wrap">
        <div class="progress"><div id="progressBar"></div></div>
        <div class="progress-text" id="progressText"></div>
      </div>
      <article class="card">
        <div class="tag" id="questionTag"></div>
        <p class="question" id="questionText"></p>
        <img class="figure hidden" id="questionImage" alt="题目插图">
        <div class="options" id="options"></div>
        <div class="actions">
          <button class="secondary" id="previous" type="button">上一题</button>
          <button class="primary" id="next" type="button" disabled>下一题</button>
        </div>
      </article>
    </section>

    <section class="card results hidden" id="results">
      <h2>练习完成</h2>
      <div class="score"><strong id="score"></strong><span id="scoreDetail"></span></div>
      <div id="wrongSummary"></div>
      <div class="wrong-list" id="wrongList"></div>
      <div class="actions">
        <button class="primary" id="again" type="button">再随机练习一次</button>
      </div>
    </section>
  </main>

  <script>
    const letters = ['A', 'B', 'C', 'D'];
    // 根据原 DOCX 中每道题的选项段落数，还原四列、两列或单列排版。
    const FOUR_COLUMN_IDS = new Set([
      1, 5, 6, 9, 10, 13, 14, 15, 16, 19, 20, 25, 26, 27, 28, 29,
      31, 32, 39, 43, 47, 49, 56, 57, 59, 61, 62, 63, 66, 68, 71, 72,
      74, 76, 78, 81, 82, 87, 88, 90, 91, 93, 94, 96, 98, 99, 100,
      102, 103, 104, 105, 106, 107, 108, 109, 113, 115, 116, 125,
      126, 127, 131, 135
    ]);
    const TWO_COLUMN_IDS = new Set([
      2, 4, 7, 8, 33, 34, 36, 38, 40, 41, 42, 44, 46, 48, 50, 51,
      53, 55, 65, 70, 77, 79, 80, 83, 84, 85, 86, 92, 95, 97, 101,
      110, 111, 112, 114, 117, 120, 121, 122, 123, 124, 128, 130,
      133, 134, 136
    ]);
    let sourceQuestions = [];
    let questions = [];
    let answers = {};
    let index = 0;
    let autoAdvanceTimer = null;

    const quiz = document.querySelector('#quiz');
    const results = document.querySelector('#results');
    const progressBar = document.querySelector('#progressBar');
    const progressText = document.querySelector('#progressText');
    const questionTag = document.querySelector('#questionTag');
    const questionText = document.querySelector('#questionText');
    const questionImage = document.querySelector('#questionImage');
    const options = document.querySelector('#options');
    const previous = document.querySelector('#previous');
    const next = document.querySelector('#next');
    const restart = document.querySelector('#restart');
    const autoNext = document.querySelector('#autoNext');

    function shuffled(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function start() {
      clearTimeout(autoAdvanceTimer);
      questions = shuffled(sourceQuestions);
      answers = {};
      index = 0;
      results.classList.add('hidden');
      quiz.classList.remove('hidden');
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function render() {
      const item = questions[index];
      progressText.textContent = (index + 1) + ' / ' + questions.length;
      progressBar.style.width = ((index + 1) / questions.length * 100) + '%';
      questionTag.textContent = '随机第 ' + (index + 1) + ' 题 · 原题号 ' + item.id;
      questionText.textContent = item.question;
      options.innerHTML = '';
      options.className = 'options ' + (
        FOUR_COLUMN_IDS.has(item.id)
          ? 'layout-four'
          : TWO_COLUMN_IDS.has(item.id)
            ? 'layout-two'
            : 'layout-one'
      );

      if (item.image) {
        questionImage.src = item.image;
        questionImage.classList.remove('hidden');
      } else {
        questionImage.removeAttribute('src');
        questionImage.classList.add('hidden');
      }

      letters.forEach((letter) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'option';
        if (answers[item.id] === letter) button.classList.add('selected');
        button.innerHTML = '<span class="letter">' + letter + '</span><span></span>';
        button.lastElementChild.textContent = item.options[letter];
        button.addEventListener('click', () => {
          answers[item.id] = letter;
          options.querySelectorAll('.option').forEach((node) => node.classList.remove('selected'));
          button.classList.add('selected');
          next.disabled = false;

          clearTimeout(autoAdvanceTimer);
          if (autoNext.checked && index < questions.length - 1) {
            const selectedQuestionId = item.id;
            autoAdvanceTimer = setTimeout(() => {
              if (questions[index]?.id !== selectedQuestionId) return;
              index += 1;
              render();
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 200);
          }
        });
        options.appendChild(button);
      });

      next.disabled = !answers[item.id];
      previous.disabled = index === 0;
      next.textContent = index === questions.length - 1 ? '提交并查看错题' : '下一题';
    }

    function goToPreviousQuestion() {
      clearTimeout(autoAdvanceTimer);
      if (index === 0) return;
      index -= 1;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    previous.addEventListener('click', goToPreviousQuestion);

    next.addEventListener('click', () => {
      clearTimeout(autoAdvanceTimer);
      if (!answers[questions[index].id]) return;
      if (index < questions.length - 1) {
        index += 1;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        finish();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (quiz.classList.contains('hidden') || event.ctrlKey || event.altKey || event.metaKey) return;

      const key = event.key.toUpperCase();
      if (letters.includes(key)) {
        event.preventDefault();
        const optionIndex = letters.indexOf(key);
        options.querySelectorAll('.option')[optionIndex]?.click();
        return;
      }

      if (event.key === 'Enter' || event.key === ' ' || event.key === 'ArrowRight') {
        event.preventDefault();
        next.click();
      } else if (event.key === 'ArrowLeft') {
        event.preventDefault();
        previous.click();
      }
    });

    function finish() {
      const wrong = questions.filter((item) => answers[item.id] !== item.answer);
      const correct = questions.length - wrong.length;
      document.querySelector('#score').textContent = correct;
      document.querySelector('#scoreDetail').textContent = '/ ' + questions.length + ' 题正确';

      const summary = document.querySelector('#wrongSummary');
      const list = document.querySelector('#wrongList');
      list.innerHTML = '';
      if (!wrong.length) {
        summary.innerHTML = '<div class="all-correct">全部答对，完成得很漂亮。</div>';
      } else {
        summary.innerHTML = '<p>共答错 <strong>' + wrong.length + '</strong> 题，下面列出全部错题。</p>';
        wrong.forEach((item) => {
          const block = document.createElement('article');
          block.className = 'wrong';
          const image = item.image ? '<img class="figure" src="' + item.image + '" alt="题目插图">' : '';
          block.innerHTML =
            '<h3>原题号 ' + item.id + '：' + escapeHtml(item.question) + '</h3>' +
            image +
            '<p class="user-answer">你的答案：' + answers[item.id] + '．' + escapeHtml(item.options[answers[item.id]]) + '</p>' +
            '<p class="correct-answer">正确答案：' + item.answer + '．' + escapeHtml(item.options[item.answer]) + '</p>';
          list.appendChild(block);
        });
      }

      quiz.classList.add('hidden');
      results.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function getCookie(name) {
      const prefix = encodeURIComponent(name) + '=';
      const item = document.cookie.split('; ').find((cookie) => cookie.startsWith(prefix));
      return item ? decodeURIComponent(item.slice(prefix.length)) : null;
    }

    function setCookie(name, value) {
      document.cookie = encodeURIComponent(name) + '=' + encodeURIComponent(value) +
        '; max-age=31536000; path=/; SameSite=Lax';
    }

    autoNext.checked = getCookie('biologyQuizAutoNext') === 'true';
    autoNext.addEventListener('change', () => {
      setCookie('biologyQuizAutoNext', String(autoNext.checked));
    });
    restart.addEventListener('click', start);
    document.querySelector('#again').addEventListener('click', start);

    async function loadQuestions() {
      try {
        const response = await fetch('./questions.json');
        if (!response.ok) throw new Error('HTTP ' + response.status);
        sourceQuestions = await response.json();
        if (!Array.isArray(sourceQuestions) || !sourceQuestions.length) {
          throw new Error('题库内容为空');
        }
        document.querySelector('#subtitle').textContent =
          '共 ' + sourceQuestions.length + ' 题，完成后统一显示成绩和全部错题。';
        restart.disabled = false;
        start();
      } catch (error) {
        questionTag.textContent = '题库加载失败';
        questionText.textContent = location.protocol === 'file:'
          ? '浏览器不允许本地 HTML 直接 fetch 文件。请通过 GitHub Pages 或本地网页服务器打开。'
          : '无法读取 questions.json，请确认它与 index.html 位于同一目录。';
        options.innerHTML = '';
        previous.disabled = true;
        next.disabled = true;
        console.error(error);
      }
    }

    loadQuestions();
  </script>
</body>
</html>
